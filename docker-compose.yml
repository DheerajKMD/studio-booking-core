services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d studio"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_SETTINGS_MODULE: config.settings.dev
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy